name: 🚀 Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:           # allow manual trigger from GitHub UI
    inputs:
      skip_tests:
        description: "Skip test job and deploy directly"
        required: false
        default: "false"

env:
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Run DB Migrations (Production)
  # ─────────────────────────────────────────────────────────
  migrate-db:
    name: 🗄️ Prisma Migrate (Production)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: 🗄️ Run Prisma migrations
        working-directory: ./backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ─────────────────────────────────────────────────────────
  # JOB 2: Backend — Build & Deploy to Render
  # ─────────────────────────────────────────────────────────
  deploy-backend:
    name: 🖥️ Deploy Backend → Render
    runs-on: ubuntu-latest
    needs: migrate-db

    env:
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/ustadji_prod?schema=public"
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRATION: "7d"
      REDIS_URL: ""
      NODE_ENV: "production"
      PORT: "4000"

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: 🗄️ Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: 🔍 TypeScript type check
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: 🏗️ Compile NestJS
        working-directory: ./backend
        run: npm run build

      - name: 🚀 Trigger Render Deploy Hook
        # Set RENDER_DEPLOY_HOOK_URL in GitHub Secrets
        # Get it from: Render Dashboard → Service → Settings → Deploy Hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "✅ Render deploy triggered"
          else
            echo "⚠️  RENDER_DEPLOY_HOOK_URL secret not set — skipping deploy trigger"
          fi

  # ─────────────────────────────────────────────────────────
  # JOB 3: Health Check (after backend deploy)
  # ─────────────────────────────────────────────────────────
  health-check:
    name: ✅ Backend Health Check
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: 🩺 Poll /health endpoint until HTTP 200
        run: |
          PROD_URL="${{ secrets.BACKEND_PROD_URL }}"
          if [ -z "$PROD_URL" ]; then
            echo "⚠️  BACKEND_PROD_URL secret not set — skipping health check"
            exit 0
          fi

          HEALTH_URL="${PROD_URL%/}/health"
          echo "Polling health endpoint: $HEALTH_URL"

          MAX_ATTEMPTS=20
          INTERVAL=15
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: HTTP status code is $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend is healthy and responding with HTTP 200!"
              exit 0
            fi

            echo "Backend not ready yet. Retrying in ${INTERVAL}s..."
            sleep $INTERVAL
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "❌ Health check timed out after $MAX_ATTEMPTS attempts (5 minutes)."
          exit 1

  # ─────────────────────────────────────────────────────────
  # JOB 4: EAS Production Submit (Google Play)
  # ─────────────────────────────────────────────────────────
  deploy-mobile:
    name: 📱 EAS Production Build & Submit
    runs-on: ubuntu-latest
    needs: health-check     # only ship mobile if backend is confirmed healthy

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ustadji-mobile/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ./ustadji-mobile
        run: npm ci

      - name: 🔧 Install EAS CLI
        run: npm install -g eas-cli

      - name: 🏗️ EAS Build (Production Android)
        working-directory: ./ustadji-mobile
        run: eas build --platform android --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📤 EAS Submit to Google Play
        working-directory: ./ustadji-mobile
        run: eas submit --platform android --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
