name: 📱 Mobile CI

on:
  push:
    branches: [main, develop]
    paths:
      - "ustadji-mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "ustadji-mobile/**"

env:
  NODE_VERSION: "20"
  WORKING_DIR: ./ustadji-mobile

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Type Check & Expo Validation
  # ─────────────────────────────────────────────────────────
  check:
    name: 🔍 Type Check & Expo Doctor
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ustadji-mobile/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: 🔍 TypeScript type check
        working-directory: ${{ env.WORKING_DIR }}
        run: npx tsc --noEmit

      - name: 🩺 Expo Doctor (config & dependency validation)
        working-directory: ${{ env.WORKING_DIR }}
        run: npx expo-doctor@latest
        continue-on-error: true   # advisory only — does not fail the pipeline

  # ─────────────────────────────────────────────────────────
  # JOB 2: EAS Preview Build (on push to main only)
  # ─────────────────────────────────────────────────────────
  eas-preview:
    name: 🏗️ EAS Preview Build (Android)
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ustadji-mobile/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: 🔧 Install EAS CLI
        run: npm install -g eas-cli

      - name: 🏗️ Build preview APK via EAS
        working-directory: ${{ env.WORKING_DIR }}
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
